name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the connector version
        run: |
          version="$(jq -r .app_version connectors/source/proofpoint_trap/proofpoint_trap.json)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match connector app_version ${version}" >&2
            exit 1
          fi
          test -f "connectors/proofpoint_trap-v${version}.tgz"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            connectors/*.tgz playbooks/*.tgz
