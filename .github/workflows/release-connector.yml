# Publishes a GitHub release for every connector package (connectors/<name>-v<x.y.z>.tgz)
# that has none yet, with the .tgz attached. See tools/release-connectors.sh for the rules.
#
# Runs on its own when a push to main adds or changes a connector package. Run it by hand
# (Actions > Release connector > Run workflow) to backfill old versions or to retry after a
# failure: it only creates what is missing.
name: Release connector

on:
  push:
    branches: [main]
    paths:
      - 'connectors/*.tgz'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-connector
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the script reads the history to tag each version on its own commit

      - name: Publish missing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/release-connectors.sh
